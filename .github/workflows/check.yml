name: "Build and Check"

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - './fastlane/**'
      - './.github/workflows/pages-ghweb.yml'
      - './ghweb/**'

    branches: [main]

jobs:
  build:
    name: Build and Check
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: 'stable' 

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Extract version from pubspec.yaml
        shell: powershell
        run: |
            $vLine = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' | Select-Object -First 1
            if (-not $vLine) { Write-Error 'version not found in pubspec.yaml'; exit 1 }
            $ver = $vLine.Matches[0].Groups[1].Value.Split('+')[0]
            echo "VERSION=$ver" >> $env:GITHUB_ENV

      - name: Build APK
        run: flutter build apk --release --build-number ${{github.run_number}}

      - name: Rename APK
        shell: powershell
        run: |
            Rename-Item -Path "build/app/outputs/flutter-apk/app-release.apk" -NewName "Hongeet_v$env:VERSION+${{github.run_number}}.apk"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hongeet Release
          path: |
              build/app/outputs/flutter-apk/Hongeet_v${{env.VERSION}}+${{github.run_number}}.apk